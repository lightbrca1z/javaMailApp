# ============================================================
# メール送信設定ファイル
# ============================================================
# 
# 【使用方法】
# 1. Gmailを使用する場合：
#    - MAIL_USERNAMEにGmailアドレスを設定
#    - MAIL_PASSWORDにアプリパスワードを設定
#    - アプリパスワードの取得: https://myaccount.google.com/apppasswords
# 
# 2. テストモード（メール送信をスキップ）：
#    - MAIL_USERNAMEとMAIL_PASSWORDを空のままにする
#    - データベースへの保存のみが実行されます
# 
# ============================================================

# SMTP設定
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587

# メール認証情報
# ※実際の値に変更してください
# 重要: MAIL_USERNAMEは完全なメールアドレス（@gmail.com付き）を入力してください
# 重要: MAIL_PASSWORDはGoogleアカウントのパスワードではなく、アプリパスワードを使用してください
MAIL_USERNAME=quwieorpt@gmail.com
MAIL_PASSWORD=lfxpnvnjzlequmtg

# テストモード（メール送信をスキップ）にする場合は上記を空にしてください
# MAIL_USERNAME=
# MAIL_PASSWORD=
